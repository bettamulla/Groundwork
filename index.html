<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Groundwork — Lead Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin="anonymous"></script>
<script>
  window.addEventListener('error', function (e) {
    var root = document.getElementById('root');
    if (root && !root.hasChildNodes()) {
      root.innerHTML = '<div style="color:#EDE9DD;font-family:monospace;padding:32px;max-width:600px;line-height:1.6;">' +
        '<strong>Groundwork failed to load.</strong><br/><br/>' +
        (e && e.message ? e.message : 'Unknown error') +
        '<br/><br/>This usually means a script from a CDN was blocked. Try opening this file directly in a browser instead of via a hosting preview, or check the browser console (F12) for details.</div>';
    }
  });
  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && !root.hasChildNodes()) {
      root.innerHTML = '<div style="color:#EDE9DD;font-family:monospace;padding:32px;max-width:600px;line-height:1.6;">' +
        '<strong>Groundwork is stuck loading.</strong><br/><br/>' +
        'React, ReactDOM, or Babel did not load in time. Check your connection or open the browser console (F12) for the exact error.</div>';
    }
  }, 5000);
</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #14201A; font-family: 'Space Grotesk', sans-serif; }
  input, select, textarea { font-family: 'Space Grotesk', sans-serif; }
  ::placeholder { color: #5C6B60; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spinner { display: inline-block; animation: spin 1s linear infinite; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2A3B30; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

const MAX_LEADS = 200;

const STAGES = [
  { key: 'seed',    label: 'Seed',    icon: '🌱', color: '#5C6B60' },
  { key: 'sprout',  label: 'Sprout',  icon: '🌿', color: '#6FA06A' },
  { key: 'bud',     label: 'Bud',     icon: '🌿', color: '#8FC96B' },
  { key: 'bloom',   label: 'Bloom',   icon: '🌸', color: '#B8E066' },
  { key: 'harvest', label: 'Harvest', icon: '🏆', color: '#E8B84B' },
  { key: 'dormant', label: 'Dormant', icon: '🚫', color: '#7A4A3A' },
];
const stageIndex = (k) => STAGES.findIndex(s => s.key === k);
const stageInfo = (k) => STAGES.find(s => s.key === k) || STAGES[0];

const FIELD_OPTIONS = [
  { key: 'skip', label: 'Skip column' },
  { key: 'name', label: 'Name' },
  { key: 'phone', label: 'Phone' },
  { key: 'email', label: 'Email' },
  { key: 'address', label: 'Area / Address' },
  { key: 'project', label: 'Project type' },
  { key: 'budget', label: 'Budget' },
  { key: 'timeline', label: 'Timeline' },
  { key: 'notes', label: 'Notes' },
];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function guessDelimiter(line) {
  if (line.includes('\t')) return '\t';
  if (line.includes(',')) return ',';
  return null;
}

function parseRawText(text) {
  const lines = text.split('\n').map(l => l.replace(/\r/g, '')).filter(l => l.trim().length > 0);
  if (lines.length === 0) return [];
  const delim = guessDelimiter(lines[0]);
  if (!delim) return lines.map(l => [l.trim()]);
  return lines.map(l => l.split(delim).map(c => c.trim().replace(/^"|"$/g, '')));
}

function guessColumnMap(rows) {
  if (rows.length === 0) return [];
  const width = Math.max(...rows.map(r => r.length));
  const defaults = ['name', 'phone', 'email', 'address', 'project', 'budget', 'timeline', 'notes'];
  const map = [];
  for (let i = 0; i < width; i++) {
    const sample = rows.slice(0, 10).map(r => r[i] || '').join(' ');
    if (/@/.test(sample)) map.push('email');
    else if (/^[\d\s()+\-.]{6,}$/.test((rows[0][i] || '').trim())) map.push('phone');
    else map.push(defaults[i] || 'skip');
  }
  return map;
}

function emptyLeadForm() {
  return { name: '', phone: '', email: '', address: '', project: '', budget: '', timeline: '', notes: '' };
}

function loadLeads() {
  try {
    const raw = localStorage.getItem('groundwork_leads');
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function saveLeads(leads) {
  try { localStorage.setItem('groundwork_leads', JSON.stringify(leads)); return true; }
  catch { return false; }
}

function Icon({ children, size = 13 }) {
  return <span style={{ fontSize: size, lineHeight: 1, display: 'inline-block' }}>{children}</span>;
}

function Groundwork() {
  const [leads, setLeads] = useState(() => loadLeads());
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [view, setView] = useState('list');
  const [importTab, setImportTab] = useState('paste');
  const [pasteText, setPasteText] = useState('');
  const [rawRows, setRawRows] = useState([]);
  const [columnMap, setColumnMap] = useState([]);
  const [showManualForm, setShowManualForm] = useState(false);
  const [manualForm, setManualForm] = useState(emptyLeadForm());
  const [editingLead, setEditingLead] = useState(null);
  const [ocrStatus, setOcrStatus] = useState('idle');
  const [toast, setToast] = useState(null);
  const fileInputRef = useRef(null);
  const photoInputRef = useRef(null);
  const tesseractLoaded = useRef(false);

  const showToast = (msg, isError = false) => {
    setToast({ msg, isError });
    setTimeout(() => setToast(null), 3200);
  };

  const updateLeads = (next) => {
    setLeads(next);
    if (!saveLeads(next)) showToast('Save failed — your browser storage may be full', true);
  };

  const remainingSlots = MAX_LEADS - leads.length;

  const submitManual = () => {
    if (!manualForm.name.trim()) { showToast('Name is required', true); return; }
    if (remainingSlots <= 0) { showToast('At 200 leads — remove some before adding more', true); return; }
    const lead = { id: uid(), ...manualForm, status: 'seed', source: 'manual', addedAt: new Date().toISOString() };
    updateLeads([lead, ...leads]);
    setManualForm(emptyLeadForm());
    setShowManualForm(false);
    showToast('Lead added');
  };

  const saveEdit = () => {
    const next = leads.map(l => l.id === editingLead.id ? editingLead : l);
    updateLeads(next);
    setEditingLead(null);
    showToast('Lead updated');
  };

  const deleteLead = (id) => {
    updateLeads(leads.filter(l => l.id !== id));
    showToast('Lead removed');
  };

  const cycleStatus = (id) => {
    const next = leads.map(l => {
      if (l.id !== id) return l;
      const i = stageIndex(l.status);
      const nextStage = STAGES[(i + 1) % STAGES.length].key;
      return { ...l, status: nextStage };
    });
    updateLeads(next);
  };

  const runParse = (text) => {
    const rows = parseRawText(text);
    setRawRows(rows);
    setColumnMap(guessColumnMap(rows));
  };

  const handlePasteParse = () => {
    if (!pasteText.trim()) { showToast('Paste some lead data first', true); return; }
    runParse(pasteText);
  };

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const text = await file.text();
    setPasteText(text);
    runParse(text);
    setImportTab('paste');
  };

  const loadTesseract = () => new Promise((resolve, reject) => {
    if (tesseractLoaded.current || window.Tesseract) { tesseractLoaded.current = true; resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js';
    script.onload = () => { tesseractLoaded.current = true; resolve(); };
    script.onerror = () => reject(new Error('Could not load OCR engine'));
    document.body.appendChild(script);
  });

  const handlePhoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setOcrStatus('loading');
    try {
      await loadTesseract();
      const { data } = await window.Tesseract.recognize(file, 'eng');
      const text = data.text || '';
      if (!text.trim()) {
        showToast('No text found in that photo — try a clearer shot', true);
        setOcrStatus('idle');
        return;
      }
      setPasteText(text);
      runParse(text);
      setImportTab('paste');
      setOcrStatus('idle');
      showToast('Text extracted — check it over before importing');
    } catch (err) {
      setOcrStatus('error');
      showToast('OCR failed to load — check your connection and retry', true);
    }
  };

  const setColMap = (idx, val) => {
    const next = [...columnMap];
    next[idx] = val;
    setColumnMap(next);
  };

  const confirmImport = () => {
    const nameIdx = columnMap.findIndex(c => c === 'name');
    if (nameIdx === -1) { showToast('Map at least one column to Name', true); return; }
    const candidates = rawRows
      .filter(r => (r[nameIdx] || '').trim().length > 0)
      .map(r => {
        const lead = { id: uid(), name: '', phone: '', email: '', address: '', project: '', budget: '', timeline: '', notes: '', status: 'seed', source: 'import', addedAt: new Date().toISOString() };
        columnMap.forEach((field, i) => {
          if (field !== 'skip' && r[i] !== undefined) lead[field] = r[i];
        });
        return lead;
      });
    const toImport = candidates.slice(0, remainingSlots);
    const overflow = candidates.length - toImport.length;
    updateLeads([...toImport, ...leads]);
    setRawRows([]);
    setColumnMap([]);
    setPasteText('');
    setView('list');
    showToast(overflow > 0
      ? `Imported ${toImport.length} — ${overflow} skipped, you're at the 200 cap`
      : `Imported ${toImport.length} lead${toImport.length === 1 ? '' : 's'}`);
  };

  const cancelImport = () => { setRawRows([]); setColumnMap([]); };

  const filtered = leads.filter(l => {
    const matchesStatus = statusFilter === 'all' || l.status === statusFilter;
    const q = search.trim().toLowerCase();
    const matchesSearch = !q || [l.name, l.phone, l.email, l.address, l.project].join(' ').toLowerCase().includes(q);
    return matchesStatus && matchesSearch;
  });

  const stageCounts = STAGES.reduce((acc, s) => { acc[s.key] = leads.filter(l => l.status === s.key).length; return acc; }, {});

  return (
    <div style={S.appShell}>
      <div style={S.container}>
        <header style={S.header}>
          <div>
            <div style={S.eyebrow}>LANDSCAPING &amp; HARDSCAPE — LEAD LEDGER</div>
            <h1 style={S.h1}>Groundwork</h1>
          </div>
          <div style={S.capacityBox}>
            <div style={S.capacityNum}>{leads.length}<span style={{ color: '#5C6B60' }}>/{MAX_LEADS}</span></div>
            <div style={S.capacityBar}><div style={{ ...S.capacityFill, width: `${(leads.length / MAX_LEADS) * 100}%` }} /></div>
          </div>
        </header>

        <div style={S.stageStrip}>
          {STAGES.map(s => (
            <button key={s.key} onClick={() => setStatusFilter(statusFilter === s.key ? 'all' : s.key)}
              style={{ ...S.stageChip, borderColor: statusFilter === s.key ? s.color : '#2A3B30', background: statusFilter === s.key ? s.color + '22' : 'transparent' }}>
              <Icon size={13}>{s.icon}</Icon>
              <span style={{ color: s.color }}>{stageCounts[s.key]}</span>
            </button>
          ))}
        </div>

        <nav style={S.tabs}>
          <button onClick={() => setView('list')} style={{ ...S.tabBtn, ...(view === 'list' ? S.tabBtnActive : {}) }}>Leads</button>
          <button onClick={() => setView('import')} style={{ ...S.tabBtn, ...(view === 'import' ? S.tabBtnActive : {}) }}>Import</button>
        </nav>

        {view === 'list' && (
          <section>
            <div style={S.toolRow}>
              <div style={S.searchBox}>
                <Icon size={14}>🔍</Icon>
                <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search name, phone, area, project…" style={S.searchInput} />
              </div>
              <button onClick={() => setShowManualForm(true)} disabled={remainingSlots <= 0} style={{ ...S.primaryBtn, opacity: remainingSlots <= 0 ? 0.4 : 1 }}>
                + Add lead
              </button>
            </div>

            {showManualForm && (
              <div style={S.card}>
                <div style={S.formGrid}>
                  <input placeholder="Name *" value={manualForm.name} onChange={e => setManualForm({ ...manualForm, name: e.target.value })} style={S.input} />
                  <input placeholder="Phone" value={manualForm.phone} onChange={e => setManualForm({ ...manualForm, phone: e.target.value })} style={S.input} />
                  <input placeholder="Email" value={manualForm.email} onChange={e => setManualForm({ ...manualForm, email: e.target.value })} style={S.input} />
                  <input placeholder="Area / address" value={manualForm.address} onChange={e => setManualForm({ ...manualForm, address: e.target.value })} style={S.input} />
                  <input placeholder="Project type" value={manualForm.project} onChange={e => setManualForm({ ...manualForm, project: e.target.value })} style={S.input} />
                  <input placeholder="Budget" value={manualForm.budget} onChange={e => setManualForm({ ...manualForm, budget: e.target.value })} style={S.input} />
                  <input placeholder="Timeline" value={manualForm.timeline} onChange={e => setManualForm({ ...manualForm, timeline: e.target.value })} style={S.input} />
                  <input placeholder="Notes" value={manualForm.notes} onChange={e => setManualForm({ ...manualForm, notes: e.target.value })} style={S.input} />
                </div>
                <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                  <button onClick={submitManual} style={S.primaryBtn}>Save lead</button>
                  <button onClick={() => { setShowManualForm(false); setManualForm(emptyLeadForm()); }} style={S.secondaryBtn}>Cancel</button>
                </div>
              </div>
            )}

            {filtered.length === 0 ? (
              <div style={S.empty}>
                {leads.length === 0 ? 'No leads yet. Add one or import a batch.' : 'Nothing matches that search or filter.'}
              </div>
            ) : (
              <div style={S.list}>
                {filtered.map(lead => {
                  const stage = stageInfo(lead.status);
                  return (
                    <div key={lead.id} style={S.leadCard}>
                      <div style={S.leadTop}>
                        <div style={S.leadName}>{lead.name || 'Unnamed lead'}</div>
                        <button onClick={() => cycleStatus(lead.id)} style={{ ...S.stageBadge, borderColor: stage.color, color: stage.color }}>
                          <Icon size={12}>{stage.icon}</Icon> {stage.label}
                        </button>
                      </div>
                      <div style={S.leadMeta}>
                        {lead.phone && <span style={S.metaItem}>☎ {lead.phone}</span>}
                        {lead.email && <span style={S.metaItem}>✉ {lead.email}</span>}
                        {lead.address && <span style={S.metaItem}>📍 {lead.address}</span>}
                      </div>
                      {(lead.project || lead.budget || lead.timeline) && (
                        <div style={S.leadDetails}>
                          {lead.project && <span style={S.detailTag}>{lead.project}</span>}
                          {lead.budget && <span style={S.detailTag}>{lead.budget}</span>}
                          {lead.timeline && <span style={S.detailTag}>{lead.timeline}</span>}
                        </div>
                      )}
                      {lead.notes && <div style={S.leadNotes}>{lead.notes}</div>}
                      <div style={S.leadFooter}>
                        <span style={S.dateStamp}>📅 {new Date(lead.addedAt).toLocaleDateString()}</span>
                        <div style={{ display: 'flex', gap: 6 }}>
                          <button onClick={() => setEditingLead({ ...lead })} style={S.iconBtn}>✎</button>
                          <button onClick={() => deleteLead(lead.id)} style={{ ...S.iconBtn, color: '#7A4A3A' }}>🗑</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </section>
        )}

        {view === 'import' && (
          <section>
            {remainingSlots <= 0 && (
              <div style={S.warnBanner}>⚠ You're at the 200 lead cap — remove leads before importing more.</div>
            )}
            <div style={S.importTabs}>
              <button onClick={() => setImportTab('paste')} style={{ ...S.importTabBtn, ...(importTab === 'paste' ? S.importTabActive : {}) }}>📋 Paste</button>
              <button onClick={() => setImportTab('file')} style={{ ...S.importTabBtn, ...(importTab === 'file' ? S.importTabActive : {}) }}>📄 File</button>
              <button onClick={() => setImportTab('photo')} style={{ ...S.importTabBtn, ...(importTab === 'photo' ? S.importTabActive : {}) }}>🖼 Photo</button>
            </div>

            {importTab === 'paste' && (
              <div style={S.card}>
                <div style={S.hint}>One lead per line. Comma or tab separated — name, phone, email, area, project, budget, timeline, notes.</div>
                <textarea value={pasteText} onChange={e => setPasteText(e.target.value)} rows={8} style={S.textarea}
                  placeholder="Jane Miller, 07700 900123, jane@email.com, Reigate, Full patio install, £8000-12000, Within 2 months" />
                <button onClick={handlePasteParse} style={S.primaryBtn}>Parse text</button>
              </div>
            )}

            {importTab === 'file' && (
              <div style={S.card}>
                <div style={S.hint}>Upload a .csv or .txt file — same format as pasting, one lead per line.</div>
                <input ref={fileInputRef} type="file" accept=".csv,.txt" onChange={handleFile} style={S.fileInput} />
              </div>
            )}

            {importTab === 'photo' && (
              <div style={S.card}>
                <div style={S.hint}>Upload a photo of handwritten or printed leads — a call sheet, a whiteboard, a form. Text gets pulled out for you to check before import.</div>
                <input ref={photoInputRef} type="file" accept="image/*" onChange={handlePhoto} style={S.fileInput} disabled={ocrStatus === 'loading'} />
                {ocrStatus === 'loading' && <div style={S.ocrLoading}><span className="spinner">⟳</span> Reading photo…</div>}
              </div>
            )}

            {rawRows.length > 0 && (
              <div style={S.previewCard}>
                <div style={S.previewHeader}>Map columns, then confirm — {rawRows.length} row{rawRows.length === 1 ? '' : 's'} found</div>
                <div style={S.previewScroll}>
                  <table style={S.table}>
                    <thead>
                      <tr>
                        {columnMap.map((c, i) => (
                          <th key={i} style={S.th}>
                            <select value={c} onChange={e => setColMap(i, e.target.value)} style={S.select}>
                              {FIELD_OPTIONS.map(f => <option key={f.key} value={f.key}>{f.label}</option>)}
                            </select>
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {rawRows.slice(0, 12).map((row, ri) => (
                        <tr key={ri}>
                          {columnMap.map((c, ci) => <td key={ci} style={S.td}>{row[ci] || ''}</td>)}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                {rawRows.length > 12 && <div style={S.hint}>+{rawRows.length - 12} more row{rawRows.length - 12 === 1 ? '' : 's'} not shown, will still import</div>}
                <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                  <button onClick={confirmImport} style={S.primaryBtn}>✓ Confirm import</button>
                  <button onClick={cancelImport} style={S.secondaryBtn}>Cancel</button>
                </div>
              </div>
            )}
          </section>
        )}
      </div>

      {editingLead && (
        <div style={S.modalOverlay} onClick={() => setEditingLead(null)}>
          <div style={S.modal} onClick={e => e.stopPropagation()}>
            <div style={S.modalHeader}>
              <div style={S.modalTitle}>Edit lead</div>
              <button onClick={() => setEditingLead(null)} style={S.iconBtn}>✕</button>
            </div>
            <div style={S.formGrid}>
              <input placeholder="Name" value={editingLead.name} onChange={e => setEditingLead({ ...editingLead, name: e.target.value })} style={S.input} />
              <input placeholder="Phone" value={editingLead.phone} onChange={e => setEditingLead({ ...editingLead, phone: e.target.value })} style={S.input} />
              <input placeholder="Email" value={editingLead.email} onChange={e => setEditingLead({ ...editingLead, email: e.target.value })} style={S.input} />
              <input placeholder="Area / address" value={editingLead.address} onChange={e => setEditingLead({ ...editingLead, address: e.target.value })} style={S.input} />
              <input placeholder="Project type" value={editingLead.project} onChange={e => setEditingLead({ ...editingLead, project: e.target.value })} style={S.input} />
              <input placeholder="Budget" value={editingLead.budget} onChange={e => setEditingLead({ ...editingLead, budget: e.target.value })} style={S.input} />
              <input placeholder="Timeline" value={editingLead.timeline} onChange={e => setEditingLead({ ...editingLead, timeline: e.target.value })} style={S.input} />
              <select value={editingLead.status} onChange={e => setEditingLead({ ...editingLead, status: e.target.value })} style={S.input}>
                {STAGES.map(s => <option key={s.key} value={s.key}>{s.label}</option>)}
              </select>
            </div>
            <textarea placeholder="Notes" value={editingLead.notes} onChange={e => setEditingLead({ ...editingLead, notes: e.target.value })} rows={3} style={{ ...S.textarea, marginTop: 8 }} />
            <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
              <button onClick={saveEdit} style={S.primaryBtn}>Save changes</button>
              <button onClick={() => setEditingLead(null)} style={S.secondaryBtn}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {toast && (
        <div style={{ ...S.toast, borderColor: toast.isError ? '#7A4A3A' : '#6FA06A', color: toast.isError ? '#D98B70' : '#B8E066' }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

const FONT_DISPLAY = "'Fraunces', Georgia, serif";
const FONT_BODY = "'Space Grotesk', sans-serif";
const FONT_MONO = "'IBM Plex Mono', ui-monospace, monospace";

const S = {
  appShell: { minHeight: '100vh', background: '#14201A', padding: '28px 16px 60px', display: 'flex', justifyContent: 'center', fontFamily: FONT_BODY, position: 'relative' },
  container: { width: '100%', maxWidth: 720 },
  header: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 14 },
  eyebrow: { fontFamily: FONT_MONO, fontSize: 10, letterSpacing: '0.12em', color: '#6FA06A', marginBottom: 4 },
  h1: { fontFamily: FONT_DISPLAY, fontSize: 34, color: '#EDE9DD', margin: 0, fontWeight: 600 },
  capacityBox: { textAlign: 'right', minWidth: 90 },
  capacityNum: { fontFamily: FONT_MONO, fontSize: 15, color: '#EDE9DD', marginBottom: 4 },
  capacityBar: { width: 90, height: 4, background: '#2A3B30', borderRadius: 2, overflow: 'hidden' },
  capacityFill: { height: '100%', background: '#6FA06A' },
